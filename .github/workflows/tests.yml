name: Tests

on:
    pull_request:
        types: [ opened ]
        branches:
            - 'staging'
            - 'preprod'
            - 'master'
    workflow_call:

jobs:
    jest-tests:
        name: Jest Unit tests
        runs-on: ubuntu-20.04
        steps:
            -   name: checkout
                uses: actions/checkout@v3

            -   name: setup node
                uses: actions/setup-node@v3
                with:
                    node-version: 16.18.0

            -   name: yarn install
                run: yarn install

            -   name: launch tests
                run: yarn test --watchAll=false

    cypress-tests:
        name: Cypress Components tests
        runs-on: ubuntu-20.04
        steps:
            -   name: checkout
                uses: actions/checkout@v3

            -   name: setup node
                uses: actions/setup-node@v3
                with:
                    node-version: 16.18.0
                env:
                    NODE_OPTIONS: "--max-old-space-size=8192"

            -   name: yarn install
                run: yarn install

            -   name: launch tests
                uses: cypress-io/github-action@v6
                env:
                    NODE_OPTIONS: "--max-old-space-size=8192"
                with:
                    browser: chrome
                    command: yarn cypress:run:component --browser chrome --config video=false,screenshotOnRunFailure=false
