name: Deploy
on:
    push:
        branches:
            - 'preprod'

jobs:
    tests:
        name: Tests
        uses: ./.github/workflows/tests.yml
    deploy-preprod:
        if: success() && (github.event_name == 'push')
        name: Deploy-preprod
        runs-on: ubuntu-20.04
        needs: tests
        continue-on-error: false

        steps:
            -   name: checkout
                uses: actions/checkout@v3

            -   name: setup node
                uses: actions/setup-node@v3
                with:
                    node-version: 16.18.0

            -   name: yarn install
                run: yarn install

            -   name: create .env
                run: cp .env.preprod .env.production

            -   name: yarn build
                run: CI='' yarn run build --profile

            -   name: copy Dockerfile and nginx conf
                run: |
                    cp ci/preprod/Dockerfile Dockerfile
                    cp ci/preprod/nginx.conf nginx.conf

            -   name: building docker image
                run: docker build -t ghcr.io/deltarm/cp1-front/github-preprod:latest -f ci/preprod/Dockerfile .

            -   name: Login to Docker Hub
                uses: docker/login-action@v2
                with:
                    registry: ghcr.io
                    username: ${{ github.repository_owner }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   name: pushing docker image
                run: docker push ghcr.io/deltarm/cp1-front/github-preprod:latest

            -   name: Deploy on Server
                uses: burnett01/rsync-deployments@5.1
                with:
                    switches: -av --include="docker-compose.*" --exclude="*"
                    path: .
                    remote_path: ${{ secrets.SSH_PREPROD_DIRECTORY_BUILD_CP1 }}
                    remote_host: ${{ secrets.SSH_PREPROD_HOST_CP1 }}
                    remote_user: ${{ secrets.SSH_COMMON_USER_CP1 }}
                    remote_key: ${{ secrets.SSH_PRIVATE_KEY_COMMON_CP1 }}

            -   name : Install on Server
                uses: JimCronqvist/action-ssh@0.1.1
                with:
                    hosts: ${{ secrets.SSH_COMMON_USER_CP1 }}@${{ secrets.SSH_PREPROD_HOST_CP1 }}
                    privateKey: ${{ secrets.SSH_PRIVATE_KEY_COMMON_CP1 }}
                    command: |
                        docker login ghcr.io/deltarm/cp1-front/github-preprod:latest -u ${{ github.repository_owner }} -p ${{ secrets.GITHUB_TOKEN }}
                        docker-compose -f /home/deltarm/client/docker-compose.preprod_github.yml pull
                        docker-compose -f /home/deltarm/client/docker-compose.preprod_github.yml up -d --remove-orphans
