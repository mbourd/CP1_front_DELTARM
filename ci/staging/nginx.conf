server {

  listen 80;
  listen 443 ssl;
  server_name www.controle-dev.deltarm.com controle-dev.deltarm.com controle-staging.deltarm.com;
  ssl_certificate /etc/nginx/certs/controle-pp.crt;
  ssl_certificate_key /etc/nginx/certs/controle-pp.key;

  add_header "Cache-Control" "no-store, max-age=0";

  location / {
    root   /usr/share/nginx/html;
    index  index.html index.htm;
    try_files $uri $uri/ /index.html;
  }

  error_page   500 502 503 504  /50x.html;

  location = /50x.html {
    root   /usr/share/nginx/html;
  }

}
